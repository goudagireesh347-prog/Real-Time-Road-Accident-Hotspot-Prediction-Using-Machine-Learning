{% extends 'base.html' %}

{% block title %}404 - Page Not Found – RoadSafe AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h2 class="fw-bold mb-3">Road Location / Page Not Found</h2>
        <p class="text-secondary max-w-md mx-auto mb-4">
            The requested spatial resource or page URL could not be located in the RoadSafe AI network.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4 py-2">
            <i class="fa-solid fa-house me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
